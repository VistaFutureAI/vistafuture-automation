
name: VistaFuture Video Automation

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 14 * * *"

permissions:
  contents: read

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "ERROR: requirements.txt tidak ditemukan"
            exit 1
          fi

      - name: Generate and upload video
        env:
          PYTHONUNBUFFERED: "1"
        run: python main.py

      - name: Save generated video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vistafuture-video
          path: |
            *.mp4
            output/
            videos/
          if-no-files-found: warn
          retention-days: 7
