
name: VistaFuture Daily Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Generate VistaFuture video
        run: python main.py

      - name: Save video, audio and script
        uses: actions/upload-artifact@v4
        with:
          name: vistafuture-video
          path: output/
          if-no-files-found: error
          retention-days: 7
